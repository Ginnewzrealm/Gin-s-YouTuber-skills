# xuanti-fenxi 配置模板
# 复制为 config.yaml 后由初始化问答填充（config.yaml 已被 gitignore，含个人 token 不入库）

pool:
  base_token: ""      # 必填：飞书多维表格 token（选题池所在 base）
  table_id: ""        # 必填：选题表 ID（tbl 前缀）

cards:
  output_dir: "~/Documents/YouTuber工作流/选题分析卡"   # 分析卡存放目录（可改）

state_options:                    # 必须与飞书表「选题状态」选项名保持一致
  entry: ["阶段一：想法记录", "想法记录"]  # 入口态（老新两版都认）
  researching: "阶段二：资料研究"
  confirmed: "阶段三：确认选题"
  eliminated: "已淘汰"
