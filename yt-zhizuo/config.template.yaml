# yt-zhizuo 配置模板（复制为 config.yaml 并填值；config.yaml 已 gitignore 不入库）
# 2026-09-10 存储重构收敛：删 doc.folder_token/paths.output_dir——
# 本地=技能内 workspace/<编号>/，飞书目标=core 共享配置 feishu_root_folder_token + <编号> <标题>/

pool:
  base_token: ""        # 必填：选题表 base token（从飞书链接解析，原样全文禁缩写）
  table_id: ""          # 必填：选题表 ID（tbl 前缀）

channel:
  language: "zh"        # 产出语言：zh / en / both

toolchain:
  voice: "self-record"          # self-record / elevenlabs / hybrid
  recording_env: "quiet"        # quiet / noisy（影响修音强度建议）
  denoise: "adobe-podcast"      # adobe-podcast / izotope / descript
  editor: "capcut-mac"          # capcut-mac / premiere / davinci
  music_library: "yt-audio-library"  # yt-audio-library / epidemic-sound / artlist
  ai_video_tools: ["kling", "jimeng"]  # 可灵 / 即梦 / runway / pika
